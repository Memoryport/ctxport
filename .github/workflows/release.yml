name: Release

# Push a tag like v0.2.0 to build ctxport and publish it to PyPI.
# Publishing uses PyPI trusted publishing (no API token in the repo). One-time setup on pypi.org:
#   Publishing → Add a new pending publisher → owner "Memoryport", repository "ctxport",
#   workflow "release.yml", environment "pypi". Also create the "pypi" environment in the repo settings.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package and extension versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/ctxport/__init__.py').read())[1])")
          ext=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "tag=$tag package=$py extension=$ext"
          test "$tag" = "$py" && test "$tag" = "$ext"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          ctxport --version
          ctxport platforms
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ctxport
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
