name: Release

# Push a tag like v0.2.0 to build ctxport, publish it to PyPI and create a GitHub release with
# the wheel and the browser extension zip attached (so users never need to clone the repository).
# Publishing uses PyPI trusted publishing (no API token in the repo). One-time setup on pypi.org:
#   Publishing → Add a new pending publisher → owner "Memoryport", repository "ctxport",
#   workflow "release.yml", environment "pypi". Also create the "pypi" environment in the repo settings, then set
#   the repository variable PUBLISH_TO_PYPI to "true" (Settings → Secrets and variables → Actions → Variables).
#   Until then the PyPI step is skipped and the GitHub release is created on its own.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package and extension versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/ctxport/__init__.py').read())[1])")
          ext=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "tag=$tag package=$py extension=$ext"
          test "$tag" = "$py" && test "$tag" = "$ext"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Pack the browser extension
        run: python scripts/pack_extension.py
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          ctxport --version
          ctxport platforms
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ctxport
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release with the wheel and extension zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ctxport $GITHUB_REF_NAME" \
            --notes "Install the CLI: download the .whl below and run \`pipx install ./ctxport-${GITHUB_REF_NAME#v}-py3-none-any.whl\`, or \`pipx install git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME\`. With the MCP server: add \`[mcp]\`, e.g. \`pipx install \"ctxport[mcp] @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME\"\`.
          Browser extension: download ctxport-extension-*.zip below, unzip it, then load the folder in chrome://extensions or edge://extensions with Developer mode on.
          See CHANGELOG.md for what changed."
