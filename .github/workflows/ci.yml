name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[mcp,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Core has no third-party imports
        run: python -c "import sys, subprocess; sys.exit(subprocess.call([sys.executable, '-I', '-c', 'import ctxport.cli, ctxport.pipeline, ctxport.extract']))"
      - name: CLI smoke test
        run: |
          ctxport --version
          ctxport platforms
