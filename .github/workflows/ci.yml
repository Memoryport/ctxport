name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[mcp,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Core has no third-party imports
        run: python -c "import sys, subprocess; sys.exit(subprocess.call([sys.executable, '-I', '-c', 'import ctxport.cli, ctxport.pipeline, ctxport.extract']))"
      - name: CLI smoke test
        run: |
          ctxport --version
          ctxport platforms

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.5"
      - name: Ruff (errors only, config in pyproject.toml)
        run: ruff check src tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check every extension script
        run: for f in extension/*.js extension/test/*.js; do node --check "$f"; done
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
      - name: Extension unit tests
        run: for t in extension/test/*.test.js; do echo "== $t"; node "$t"; done
