<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ctxport</title>
<style>
  :root { --bg:#ffffff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --accent:#2f5bea; --ok:#15803d; --err:#b91c1c; --chip:#f3f4f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#eceef2; --muted:#9aa1ad; --line:#2b2f37; --accent:#7c9bff; --ok:#4ade80; --err:#f87171; --chip:#22262e; } }
  * { box-sizing: border-box; }
  body { margin:0; width:360px; font:13px/1.45 -apple-system, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; letter-spacing:.2px; }
  .srv { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  main { padding:12px 16px 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:0; }
  .name { font-weight:600; }
  .st { font-size:12px; color:var(--muted); text-align:right; max-width:200px; }
  .st.err { color:var(--err); } .st.ok { color:var(--ok); }
  button { font:inherit; border:0; border-radius:8px; padding:9px 12px; cursor:pointer; }
  .primary { width:100%; margin-top:12px; background:var(--accent); color:#fff; font-weight:600; }
  .primary:disabled { opacity:.55; cursor:default; }
  .secondary { background:var(--chip); color:var(--fg); }
  .opts { margin-top:12px; display:grid; gap:8px; font-size:12px; color:var(--muted); }
  .opts label { display:flex; align-items:center; gap:8px; }
  .opts input[type=number] { width:64px; background:var(--chip); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; }
  pre { margin:12px 0 0; max-height:150px; overflow:auto; background:var(--chip); border-radius:8px; padding:8px; font-size:11px; white-space:pre-wrap; word-break:break-word; }
  .hint { margin-top:10px; font-size:12px; color:var(--muted); }
  code { background:var(--chip); padding:1px 5px; border-radius:4px; }
  .pair { margin:10px 0; }
  .pairrow { display:flex; gap:6px; margin-top:6px; }
  .pairrow input { flex:1; font:inherit; letter-spacing:1px; text-transform:uppercase; }
</style>
</head>
<body>
<header>
  <h1>ctxport</h1>
  <div class="srv"><span id="dot" class="dot"></span><span id="srv">检查本地服务…</span></div>
</header>
<main>
  <div class="row"><span class="name">ChatGPT</span><span class="st" id="st-chatgpt">–</span></div>
  <div class="row"><span class="name">Claude.ai</span><span class="st" id="st-claude-ai">–</span></div>
  <div class="row"><span class="name">Gemini <small>(实验)</small></span><span class="st" id="st-gemini-web">–</span></div>
  <div class="pair" id="pair" hidden>
    <div class="hint">首次使用需要配对：在终端执行 <code>ctxport serve-ingest --pair</code>，把显示的配对码填在下面。<br>
      First time: run <code>ctxport serve-ingest --pair</code> and enter the code it prints.</div>
    <div class="pairrow"><input id="code" placeholder="ABCD-EFGH" maxlength="12" autocomplete="off" spellcheck="false">
      <button id="pairbtn">配对 / Pair</button></div>
    <div class="st err" id="pairerr"></div>
  </div>
  <button class="primary" id="sync">一键同步全部 / Sync all</button>
  <div class="opts">
    <label><input type="checkbox" id="full"> 全量重新下载（默认只同步新增和改动）</label>
    <label><input type="checkbox" id="auto"> 打开这些网站时自动同步（最多每 6 小时一次）</label>
    <label>后台定时同步每 <input type="number" id="hours" min="0" max="168"> 小时（0 = 关闭）</label>
    <label>本地端口 <input type="number" id="port" min="1024" max="65535"></label>
  </div>
  <div class="hint" id="hint" hidden>本地服务未运行。在终端执行 <code>ctxport serve-ingest</code>，或用 <code>ctxport serve-ingest --autostart install</code> 让它开机自启。</div>
  <pre id="log"></pre>
</main>
<script src="popup.js"></script>
</body>
</html>
