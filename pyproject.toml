[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxport"
dynamic = ["version"]
description = "Local-first migration of AI chat history and memory between ChatGPT, Claude, Codex, Gemini, Antigravity, Cherry Studio and Chatbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Memoryport" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["chatgpt", "claude", "codex", "gemini", "mcp", "memory", "export", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Memoryport/ctxport"
Repository = "https://github.com/Memoryport/ctxport"
Issues = "https://github.com/Memoryport/ctxport/issues"
Changelog = "https://github.com/Memoryport/ctxport/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ctxport = "ctxport.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ctxport.__version__" }  # single source: src/ctxport/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxport = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Errors only (syntax errors, undefined names, unused imports/variables); no style rules.
select = ["E9", "F"]
